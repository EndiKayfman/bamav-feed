name: Sync feeds and parts index

on:
  push:
    branches: [main]
    paths:
      - bamper.csv
      - avby.csv
      - inbox/**
      - scripts/**

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge inbox into avby.csv
        run: python scripts/merge_inbox.py

      - name: Build parts.json
        run: python scripts/build_parts_index.py

      - name: Commit feed updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avby.csv parts.json inbox || true
          # inbox deletions
          git add -u inbox || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Merge inbox into avby.csv and refresh parts.json"
          git push
