<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Запчасть</title>
  <style>
    :root {
      --bg: #1a1f1c;
      --surface: #2c3430;
      --mist: #c5d0ca;
      --muted: #8a968f;
      --emerald: #2dd4a8;
      --graphite: #152018;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, #243028 0%, transparent 50%),
        linear-gradient(160deg, var(--bg), var(--graphite));
      color: var(--mist);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--mist) 10%, transparent);
      border-radius: 16px;
      padding: 28px 22px;
      text-align: center;
    }
    .label {
      margin: 0 0 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .article {
      margin: 0 0 16px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      word-break: break-all;
      color: var(--mist);
    }
    .article.empty { color: var(--muted); font-size: 1.1rem; font-weight: 500; }
    .status {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .status.hidden { display: none; }
    .status.loading {
      color: var(--muted);
      background: color-mix(in srgb, var(--mist) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--mist) 12%, transparent);
    }
    .status.not-found {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    }
    .status.error {
      color: var(--muted);
      background: color-mix(in srgb, var(--mist) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--mist) 12%, transparent);
    }
    .loc {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--emerald) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--emerald) 35%, transparent);
      text-align: left;
    }
    .loc.hidden { display: none; }
    .loc-line {
      margin: 0;
      padding: 3px 0;
      color: var(--emerald);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .loc-line + .loc-line {
      margin-top: 2px;
    }
    .photo-wrap {
      margin: 0 auto 18px;
      width: 180px;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      border: 1px solid color-mix(in srgb, var(--mist) 15%, transparent);
    }
    .photo-wrap.hidden { display: none; }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .actions.hidden { display: none; }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 16px 18px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    a.btn:active { transform: scale(0.98); }
    a.btn.primary {
      background: var(--emerald);
      color: var(--bg);
    }
    a.btn.secondary {
      background: transparent;
      color: var(--mist);
      border: 1px solid color-mix(in srgb, var(--mist) 28%, transparent);
    }
    .hint {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .hint.hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">Артикул</p>
    <p id="article" class="article empty">не указан</p>
    <p id="status" class="status hidden"></p>
    <div id="loc" class="loc hidden"></div>
    <div id="photo-wrap" class="photo-wrap hidden">
      <img id="photo" alt="Фото запчасти" />
    </div>
    <div id="actions" class="actions hidden">
      <a id="btn-bamper" class="btn primary" href="#">Смотреть на bamper.by</a>
      <a id="btn-avby" class="btn secondary" href="#">Смотреть на av.by</a>
    </div>
    <p id="hint" class="hint hidden">Выберите сайт, чтобы открыть поиск по этой запчасти</p>
  </main>
  <script>
    (function () {
      var BAMPER_CSV = "bamper.csv";
      var AVBY_CSV = "avby.csv";

      function norm(value) {
        return String(value || "").trim().toUpperCase();
      }

      function parseCsvLine(line) {
        var cols = [];
        var cur = "";
        var inQuotes = false;
        for (var i = 0; i < line.length; i++) {
          var ch = line[i];
          if (inQuotes) {
            if (ch === '"') {
              if (line[i + 1] === '"') {
                cur += '"';
                i++;
              } else {
                inQuotes = false;
              }
            } else {
              cur += ch;
            }
          } else if (ch === '"') {
            inQuotes = true;
          } else if (ch === ";") {
            cols.push(cur);
            cur = "";
          } else {
            cur += ch;
          }
        }
        cols.push(cur);
        return cols;
      }

      function decodeLocLines(code) {
        if (!code) return [];
        var raw = code.trim();
        var cOnly = raw.toUpperCase().replace(/К/g, "K");
        if (cOnly === "K1") return ["Контейнер К1"];
        if (cOnly === "K2") return ["Контейнер К2"];

        var parts = raw.split(".");
        if (parts.length === 4) {
          return [
            "Склад " + parts[0],
            "Стеллаж " + parts[1],
            "Секция " + parts[2],
            "Полка " + parts[3],
          ];
        }
        if (parts.length === 5) {
          var mid = String(parts[1] || "").toUpperCase().replace(/К/g, "K");
          if (mid === "K1") return ["Контейнер К1"];
          if (mid === "K2") return ["Контейнер К2"];
          return [
            "Склад " + parts[0],
            "Стеллаж " + parts[2],
            "Секция " + parts[3],
            "Полка " + parts[4],
          ];
        }
        return [code];
      }

      function warehouseLabelToLines(label) {
        if (!label) return [];
        var text = label.trim();
        var cOnly = text.toUpperCase().replace(/К/g, "K");
        if (cOnly === "K1") return ["Контейнер К1"];
        if (cOnly === "K2") return ["Контейнер К2"];

        var match = text.match(
          /Склад\s*(\d+).*?Ст\.?\s*(\d+).*?Сек\.?\s*(\d+).*?Пол\.?\s*(\d+)/i
        );
        if (match) {
          return [
            "Склад " + match[1],
            "Стеллаж " + match[2],
            "Секция " + match[3],
            "Полка " + match[4],
          ];
        }

        if (/контейнер/i.test(text)) return [text];
        if (/^K[12]$/i.test(cOnly)) return ["Контейнер " + text.replace(/K/i, "К")];
        return [text];
      }

      function renderLoc(el, lines) {
        if (!lines.length) return;
        el.innerHTML = lines
          .map(function (line) {
            return '<p class="loc-line">' + line + "</p>";
          })
          .join("");
        el.classList.remove("hidden");
      }

      function firstPhotoUrl(raw) {
        if (!raw) return "";
        var parts = String(raw).split(",");
        for (var i = 0; i < parts.length; i++) {
          var url = parts[i].trim();
          if (/^https?:\/\//i.test(url)) return url;
        }
        return "";
      }

      function findInCsv(text, articleNorm, idColumns) {
        var lines = text.split(/\r?\n/).filter(function (line) {
          return line.trim().length > 0;
        });
        if (lines.length < 2) return null;

        var header = parseCsvLine(lines[0]);
        var indexes = idColumns
          .map(function (name) {
            return header.indexOf(name);
          })
          .filter(function (idx) {
            return idx >= 0;
          });
        if (!indexes.length) return null;

        for (var i = 1; i < lines.length; i++) {
          var row = parseCsvLine(lines[i]);
          for (var j = 0; j < indexes.length; j++) {
            if (norm(row[indexes[j]]) === articleNorm) {
              return row;
            }
          }
        }
        return null;
      }

      function findPart(articleNorm, bamperText, avbyText) {
        var bamperHeader = parseCsvLine(bamperText.split(/\r?\n/)[0] || "");
        var bamperRow = findInCsv(bamperText, articleNorm, [
          "ID_EXT",
          "ОРИГИНАЛЬНЫЙ НОМЕР",
        ]);
        if (bamperRow) {
          return {
            warehouse:
              bamperRow[bamperHeader.indexOf("СКЛАДСКАЯ ИНФОРМАЦИЯ")] || "",
            photo: bamperRow[bamperHeader.indexOf("ФОТО")] || "",
          };
        }

        var avbyHeader = parseCsvLine(avbyText.split(/\r?\n/)[0] || "");
        var avbyRow = findInCsv(avbyText, articleNorm, ["ID", "OEM"]);
        if (avbyRow) {
          return {
            warehouse: "",
            photo: avbyRow[avbyHeader.indexOf("PHOTO")] || "",
          };
        }

        return null;
      }

      function setStatus(el, kind, message) {
        el.textContent = message;
        el.className = "status " + kind;
      }

      function showPhoto(wrap, img, url) {
        if (!/^https?:\/\//i.test(url)) return;
        img.src = url;
        img.onerror = function () {
          wrap.classList.add("hidden");
        };
        wrap.classList.remove("hidden");
      }

      function showFoundUI(part, article, locCode, photoParam) {
        var locEl = document.getElementById("loc");
        var photoWrap = document.getElementById("photo-wrap");
        var photoEl = document.getElementById("photo");
        var actions = document.getElementById("actions");
        var hint = document.getElementById("hint");
        var bamper = document.getElementById("btn-bamper");
        var avby = document.getElementById("btn-avby");

        var locLines = locCode
          ? decodeLocLines(locCode)
          : warehouseLabelToLines(part.warehouse);
        renderLoc(locEl, locLines);

        var photo = photoParam || firstPhotoUrl(part.photo);
        showPhoto(photoWrap, photoEl, photo);

        var encoded = encodeURIComponent(article);
        bamper.href = "https://bamper.by/zchbu/artikul_" + article + "/";
        avby.href =
          "https://parts.av.by/filter?category_type=1&vendor_code=" +
          encoded +
          "&price_currency=1";

        actions.classList.remove("hidden");
        hint.classList.remove("hidden");
      }

      async function verifyAndRender(article, locCode, photoParam) {
        var statusEl = document.getElementById("status");
        setStatus(statusEl, "loading", "Проверяем склад…");

        try {
          var responses = await Promise.all([
            fetch(BAMPER_CSV, { cache: "no-store" }),
            fetch(AVBY_CSV, { cache: "no-store" }),
          ]);
          if (!responses[0].ok || !responses[1].ok) {
            throw new Error("csv fetch failed");
          }

          var texts = await Promise.all(responses.map(function (r) {
            return r.text();
          }));
          var part = findPart(norm(article), texts[0], texts[1]);

          if (!part) {
            setStatus(
              statusEl,
              "not-found",
              "Такой запчасти нет на складе"
            );
            return;
          }

          statusEl.classList.add("hidden");
          showFoundUI(part, article, locCode, photoParam);
        } catch (err) {
          setStatus(
            statusEl,
            "error",
            "Не удалось проверить склад. Проверьте подключение к интернету."
          );
        }
      }

      var params = new URLSearchParams(window.location.search);
      var article = (params.get("a") || params.get("article") || "").trim();
      var locCode = (params.get("loc") || params.get("location") || "").trim();
      var photo = (params.get("p") || params.get("photo") || "").trim();

      var el = document.getElementById("article");

      if (!article) {
        el.textContent = "не указан";
        el.classList.add("empty");
        return;
      }

      el.textContent = article;
      el.classList.remove("empty");
      verifyAndRender(article, locCode, photo);
    })();
  </script>
</body>
</html>
