<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Запчасть</title>
  <style>
    :root {
      --bg: #1a1f1c;
      --surface: #2c3430;
      --mist: #c5d0ca;
      --muted: #8a968f;
      --emerald: #2dd4a8;
      --graphite: #152018;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, #243028 0%, transparent 50%),
        linear-gradient(160deg, var(--bg), var(--graphite));
      color: var(--mist);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--mist) 10%, transparent);
      border-radius: 16px;
      padding: 28px 22px;
      text-align: center;
    }
    .label {
      margin: 0 0 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .article {
      margin: 0 0 16px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      word-break: break-all;
      color: var(--mist);
    }
    .article.empty { color: var(--muted); font-size: 1.1rem; font-weight: 500; }
    .status {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .status.hidden { display: none; }
    .status.loading {
      color: var(--muted);
      background: color-mix(in srgb, var(--mist) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--mist) 12%, transparent);
    }
    .status.not-found {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    }
    .status.error {
      color: var(--muted);
      background: color-mix(in srgb, var(--mist) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--mist) 12%, transparent);
    }
    .loc {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--emerald) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--emerald) 35%, transparent);
      text-align: left;
    }
    .loc.hidden { display: none; }
    .loc-line {
      margin: 0;
      padding: 3px 0;
      color: var(--emerald);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .loc-line + .loc-line {
      margin-top: 2px;
    }
    .photo-wrap {
      margin: 0 auto 18px;
      width: 180px;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      border: 1px solid color-mix(in srgb, var(--mist) 15%, transparent);
    }
    .photo-wrap.hidden { display: none; }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .actions.hidden { display: none; }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 16px 18px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    a.btn:active { transform: scale(0.98); }
    a.btn.primary {
      background: var(--emerald);
      color: var(--bg);
    }
    a.btn.secondary {
      background: transparent;
      color: var(--mist);
      border: 1px solid color-mix(in srgb, var(--mist) 28%, transparent);
    }
    .hint {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .hint.hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">Артикул</p>
    <p id="article" class="article empty">не указан</p>
    <p id="status" class="status hidden"></p>
    <div id="loc" class="loc hidden"></div>
    <div id="photo-wrap" class="photo-wrap hidden">
      <img id="photo" alt="Фото запчасти" />
    </div>
    <div id="actions" class="actions hidden">
      <a id="btn-bamper" class="btn primary" href="#">Смотреть на bamper.by</a>
      <a id="btn-avby" class="btn secondary" href="#">Смотреть на av.by</a>
    </div>
    <p id="hint" class="hint hidden">Выберите сайт, чтобы открыть поиск по этой запчасти</p>
  </main>
  <script>
    (function () {
      var PARTS_INDEX = "parts.json";
      var BAMPER_CSV = "bamper.csv";
      var AVBY_CSV = "avby.csv";
      var CACHE_KEY = "bamav-parts-v1";

      function norm(value) {
        return String(value || "").trim().toUpperCase();
      }

      function parseCsvLine(line) {
        var cols = [];
        var cur = "";
        var inQuotes = false;
        for (var i = 0; i < line.length; i++) {
          var ch = line[i];
          if (inQuotes) {
            if (ch === '"') {
              if (line[i + 1] === '"') {
                cur += '"';
                i++;
              } else {
                inQuotes = false;
              }
            } else {
              cur += ch;
            }
          } else if (ch === '"') {
            inQuotes = true;
          } else if (ch === ";") {
            cols.push(cur);
            cur = "";
          } else {
            cur += ch;
          }
        }
        cols.push(cur);
        return cols;
      }

      function decodeLocLines(code) {
        if (!code) return [];
        var raw = code.trim();
        var cOnly = raw.toUpperCase().replace(/К/g, "K");
        if (cOnly === "K1") return ["Контейнер К1"];
        if (cOnly === "K2") return ["Контейнер К2"];

        var parts = raw.split(".");
        if (parts.length === 4) {
          return [
            "Склад " + parts[0],
            "Стеллаж " + parts[1],
            "Секция " + parts[2],
            "Полка " + parts[3],
          ];
        }
        if (parts.length === 5) {
          var mid = String(parts[1] || "").toUpperCase().replace(/К/g, "K");
          if (mid === "K1") return ["Контейнер К1"];
          if (mid === "K2") return ["Контейнер К2"];
          return [
            "Склад " + parts[0],
            "Стеллаж " + parts[2],
            "Секция " + parts[3],
            "Полка " + parts[4],
          ];
        }
        return [code];
      }

      function warehouseLabelToLines(label) {
        if (!label) return [];
        var text = label.trim();
        var boxMatch = text.match(/(?:^|\s·\s*)Ящик:\s*(.+)$/i);
        var boxLine = boxMatch ? boxMatch[1].trim() : "";
        if (boxMatch) {
          text = text.slice(0, boxMatch.index).replace(/\s·\s*$/, "").trim();
        }

        var cOnly = text.toUpperCase().replace(/К/g, "K");
        var lines = [];
        if (cOnly === "K1") lines = ["Контейнер К1"];
        else if (cOnly === "K2") lines = ["Контейнер К2"];
        else {
          var match = text.match(
            /Склад\s*(\d+).*?Ст\.?\s*(\d+).*?Сек\.?\s*(\d+).*?Пол\.?\s*(\d+)/i
          );
          if (match) {
            lines = [
              "Склад " + match[1],
              "Стеллаж " + match[2],
              "Секция " + match[3],
              "Полка " + match[4],
            ];
          } else if (/контейнер/i.test(text)) {
            lines = [text];
          } else if (/^K[12]$/i.test(cOnly)) {
            lines = ["Контейнер " + text.replace(/K/i, "К")];
          } else if (text) {
            lines = [text];
          }
        }

        if (boxLine) lines.push("Ящик: " + boxLine);
        return lines;
      }

      function locLinesWithBox(locCode, warehouseLabel, boxText) {
        var lines = locCode
          ? decodeLocLines(locCode)
          : warehouseLabelToLines(warehouseLabel);
        var box = (boxText || "").trim();
        if (!box) return lines;
        var hasBox = lines.some(function (line) {
          return /^Ящик:/i.test(line);
        });
        if (!hasBox) lines.push("Ящик: " + box);
        return lines;
      }

      function renderLoc(el, lines) {
        if (!lines.length) return;
        el.innerHTML = lines
          .map(function (line) {
            return '<p class="loc-line">' + line + "</p>";
          })
          .join("");
        el.classList.remove("hidden");
      }

      function readCache() {
        try {
          var raw = localStorage.getItem(CACHE_KEY);
          if (!raw) return null;
          var data = JSON.parse(raw);
          if (!data || !data.parts) return null;
          return data;
        } catch (e) {
          return null;
        }
      }

      function writeCache(data) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        } catch (e) {}
      }

      function lookupPart(index, articleNorm) {
        if (!index || !index.parts) return null;
        var hit = index.parts[articleNorm];
        if (!hit) return null;
        return {
          warehouse: hit.w || "",
          photo: hit.p || "",
        };
      }

      function firstPhotoUrl(raw) {
        if (!raw) return "";
        var parts = String(raw).split(",");
        for (var i = 0; i < parts.length; i++) {
          var url = parts[i].trim();
          if (/^https?:\/\//i.test(url)) return url;
        }
        return "";
      }

      async function fetchPartsIndex(forceFresh) {
        var url = PARTS_INDEX;
        if (forceFresh) url += "?_=" + Date.now();
        var resp = await fetch(url, forceFresh ? { cache: "no-store" } : undefined);
        if (!resp.ok) return null;
        var data = await resp.json();
        if (!data || !data.parts) return null;
        writeCache(data);
        return data;
      }

      async function fetchIndexFromCsv() {
        var responses = await Promise.all([
          fetch(BAMPER_CSV),
          fetch(AVBY_CSV),
        ]);
        if (!responses[0].ok || !responses[1].ok) {
          throw new Error("csv fetch failed");
        }
        var texts = await Promise.all(responses.map(function (r) {
          return r.text();
        }));

        var parts = {};
        var lines = texts[0].split(/\r?\n/).filter(function (line) {
          return line.trim().length > 0;
        });
        if (lines.length >= 2) {
          var header = parseCsvLine(lines[0]);
          var idIdx = header.indexOf("ID_EXT");
          var oemIdx = header.indexOf("ОРИГИНАЛЬНЫЙ НОМЕР");
          var whIdx = header.indexOf("СКЛАДСКАЯ ИНФОРМАЦИЯ");
          var photoIdx = header.indexOf("ФОТО");
          for (var i = 1; i < lines.length; i++) {
            var row = parseCsvLine(lines[i]);
            var entry = {
              w: whIdx >= 0 ? row[whIdx] || "" : "",
              p: photoIdx >= 0 ? row[photoIdx] || "" : "",
            };
            if (idIdx >= 0) {
              var idKey = norm(row[idIdx]);
              if (idKey) parts[idKey] = entry;
            }
            if (oemIdx >= 0) {
              var oemKey = norm(row[oemIdx]);
              if (oemKey && !parts[oemKey]) parts[oemKey] = entry;
            }
          }
        }

        var avbyLines = texts[1].split(/\r?\n/).filter(function (line) {
          return line.trim().length > 0;
        });
        if (avbyLines.length >= 2) {
          var avbyHeader = parseCsvLine(avbyLines[0]);
          var avbyIdIdx = avbyHeader.indexOf("ID");
          var avbyOemIdx = avbyHeader.indexOf("OEM");
          var avbyPhotoIdx = avbyHeader.indexOf("PHOTO");
          for (var j = 1; j < avbyLines.length; j++) {
            var avbyRow = parseCsvLine(avbyLines[j]);
            var avbyEntry = {
              w: "",
              p: avbyPhotoIdx >= 0 ? avbyRow[avbyPhotoIdx] || "" : "",
            };
            if (avbyIdIdx >= 0) {
              var avbyIdKey = norm(avbyRow[avbyIdIdx]);
              if (avbyIdKey && !parts[avbyIdKey]) parts[avbyIdKey] = avbyEntry;
            }
            if (avbyOemIdx >= 0) {
              var avbyOemKey = norm(avbyRow[avbyOemIdx]);
              if (avbyOemKey && !parts[avbyOemKey]) parts[avbyOemKey] = avbyEntry;
            }
          }
        }

        var index = { updated: new Date().toISOString(), parts: parts };
        writeCache(index);
        return index;
      }

      async function loadIndex() {
        try {
          var index = await fetchPartsIndex(true);
          if (index) return index;
        } catch (e) {}

        return fetchIndexFromCsv();
      }

      async function lookupPartWithFallback(articleNorm) {
        try {
          var index = await fetchPartsIndex(true);
          if (index) {
            var hit = lookupPart(index, articleNorm);
            if (hit) return hit;
          }
        } catch (e) {}

        try {
          var csvIndex = await fetchIndexFromCsv();
          return lookupPart(csvIndex, articleNorm);
        } catch (e) {
          return null;
        }
      }

      function setStatus(el, kind, message) {
        el.textContent = message;
        el.className = "status " + kind;
      }

      function showPhoto(wrap, img, url) {
        if (!/^https?:\/\//i.test(url)) return;
        img.src = url;
        img.onerror = function () {
          wrap.classList.add("hidden");
        };
        wrap.classList.remove("hidden");
      }

      function showFoundUI(part, article, locCode, boxCode, photoParam) {
        var statusEl = document.getElementById("status");
        var locEl = document.getElementById("loc");
        var photoWrap = document.getElementById("photo-wrap");
        var photoEl = document.getElementById("photo");
        var actions = document.getElementById("actions");
        var hint = document.getElementById("hint");
        var bamper = document.getElementById("btn-bamper");
        var avby = document.getElementById("btn-avby");

        statusEl.classList.add("hidden");

        renderLoc(
          locEl,
          locLinesWithBox(locCode, part.warehouse, boxCode)
        );

        var photo = photoParam || firstPhotoUrl(part.photo);
        showPhoto(photoWrap, photoEl, photo);

        var encoded = encodeURIComponent(article);
        bamper.href = "https://bamper.by/zchbu/artikul_" + article + "/";
        avby.href =
          "https://parts.av.by/filter?category_type=1&vendor_code=" +
          encoded +
          "&price_currency=1";

        actions.classList.remove("hidden");
        hint.classList.remove("hidden");
      }

      function showNotFound(statusEl) {
        setStatus(statusEl, "not-found", "Такой запчасти нет на складе");
      }

      async function verifyAndRender(article, locCode, boxCode, photoParam) {
        var statusEl = document.getElementById("status");
        var articleNorm = norm(article);
        var cached = readCache();
        var cachedHit = cached ? lookupPart(cached, articleNorm) : null;

        if (cachedHit) {
          showFoundUI(cachedHit, article, locCode, boxCode, photoParam);
          lookupPartWithFallback(articleNorm)
            .then(function (freshHit) {
              if (freshHit) {
                showFoundUI(freshHit, article, locCode, boxCode, photoParam);
              } else {
                showNotFound(statusEl);
              }
            })
            .catch(function () {});
          return;
        }

        setStatus(statusEl, "loading", "Проверяем склад…");

        try {
          var part = await lookupPartWithFallback(articleNorm);
          if (part) {
            showFoundUI(part, article, locCode, boxCode, photoParam);
          } else {
            showNotFound(statusEl);
          }
        } catch (err) {
          setStatus(
            statusEl,
            "error",
            "Не удалось проверить склад. Проверьте подключение к интернету."
          );
        }
      }

      var params = new URLSearchParams(window.location.search);
      var article = (params.get("a") || params.get("article") || "").trim();
      var locCode = (params.get("loc") || params.get("location") || "").trim();
      var boxCode = (params.get("box") || "").trim();
      var photo = (params.get("p") || params.get("photo") || "").trim();

      var el = document.getElementById("article");

      if (!article) {
        el.textContent = "не указан";
        el.classList.add("empty");
        return;
      }

      el.textContent = article;
      el.classList.remove("empty");
      verifyAndRender(article, locCode, boxCode, photo);
    })();
  </script>
</body>
</html>
