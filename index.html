<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Запчасть</title>
  <style>
    :root {
      --bg: #1a1f1c;
      --surface: #2c3430;
      --mist: #c5d0ca;
      --muted: #8a968f;
      --emerald: #2dd4a8;
      --graphite: #152018;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, #243028 0%, transparent 50%),
        linear-gradient(160deg, var(--bg), var(--graphite));
      color: var(--mist);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--mist) 10%, transparent);
      border-radius: 16px;
      padding: 28px 22px;
      text-align: center;
    }
    .label {
      margin: 0 0 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .article {
      margin: 0 0 16px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      word-break: break-all;
      color: var(--mist);
    }
    .article.empty { color: var(--muted); font-size: 1.1rem; font-weight: 500; }
    .loc {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--emerald) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--emerald) 35%, transparent);
      color: var(--emerald);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
    }
    .loc.hidden { display: none; }
    .photo-wrap {
      margin: 0 auto 18px;
      width: 180px;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      border: 1px solid color-mix(in srgb, var(--mist) 15%, transparent);
    }
    .photo-wrap.hidden { display: none; }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 16px 18px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    a.btn:active { transform: scale(0.98); }
    a.btn.primary {
      background: var(--emerald);
      color: var(--bg);
    }
    a.btn.secondary {
      background: transparent;
      color: var(--mist);
      border: 1px solid color-mix(in srgb, var(--mist) 28%, transparent);
    }
    a.btn[aria-disabled="true"] {
      opacity: 0.4;
      pointer-events: none;
    }
    .hint {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">Артикул</p>
    <p id="article" class="article empty">не указан</p>
    <div id="loc" class="loc hidden"></div>
    <div id="photo-wrap" class="photo-wrap hidden">
      <img id="photo" alt="Фото запчасти" />
    </div>
    <div class="actions">
      <a id="btn-bamper" class="btn primary" href="#" aria-disabled="true">Смотреть на bamper.by</a>
      <a id="btn-avby" class="btn secondary" href="#" aria-disabled="true">Смотреть на av.by</a>
    </div>
    <p class="hint">Выберите сайт, чтобы открыть поиск по этой запчасти</p>
  </main>
  <script>
    (function () {
      function decodeLoc(code) {
        if (!code) return "";
        var parts = code.trim().split(".");
        if (parts.length !== 5) return code;
        var container = String(parts[1] || "").toUpperCase().replace("К", "K");
        if (container === "K1") container = "К1";
        else if (container === "K2") container = "К2";
        else return code;
        return (
          "Склад 1 · " +
          container +
          " · Ст." +
          parts[2] +
          " · Сек." +
          parts[3] +
          " · Пол." +
          parts[4]
        );
      }

      var params = new URLSearchParams(window.location.search);
      var article = (params.get("a") || params.get("article") || "").trim();
      var locCode = (params.get("loc") || params.get("location") || "").trim();
      var photo = (params.get("p") || params.get("photo") || "").trim();

      var el = document.getElementById("article");
      var locEl = document.getElementById("loc");
      var photoWrap = document.getElementById("photo-wrap");
      var photoEl = document.getElementById("photo");
      var bamper = document.getElementById("btn-bamper");
      var avby = document.getElementById("btn-avby");

      if (!article) {
        el.textContent = "не указан";
        el.classList.add("empty");
        return;
      }

      el.textContent = article;
      el.classList.remove("empty");

      if (locCode) {
        locEl.textContent = decodeLoc(locCode);
        locEl.classList.remove("hidden");
      }

      if (/^https?:\/\//i.test(photo)) {
        photoEl.src = photo;
        photoEl.onerror = function () {
          photoWrap.classList.add("hidden");
        };
        photoWrap.classList.remove("hidden");
      }

      var encoded = encodeURIComponent(article);
      bamper.href = "https://bamper.by/zchbu/artikul_" + article + "/";
      avby.href =
        "https://parts.av.by/filter?category_type=1&vendor_code=" +
        encoded +
        "&price_currency=1";
      bamper.removeAttribute("aria-disabled");
      avby.removeAttribute("aria-disabled");
    })();
  </script>
</body>
</html>
